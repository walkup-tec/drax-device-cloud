# Redeploy da API Device Cloud no servidor AWS (systemd ddc-api) após push em main.
# Host real: api-devices.draxsistemas.com.br → 3.134.105.10 (não Hostinger 72.60.51.127)
# Secrets: VPS_DEVICE_CLOUD_SSH_KEY (chave ubuntu@3.134.105.10) — opcional se usar script no servidor

name: Deploy Device Cloud API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy push-file via SSH (AWS)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 3.134.105.10
          username: ubuntu
          key: ${{ secrets.VPS_DEVICE_CLOUD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/device-cloud
            git fetch origin main
            bash scripts/deploy-push-file-production.sh /opt/device-cloud || {
              git pull origin main || true
              npm run build
              sudo systemctl restart ddc-api.service
            }
            sleep 3
            curl -fsS http://127.0.0.1:4050/health
